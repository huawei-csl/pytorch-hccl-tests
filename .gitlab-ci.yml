image: "python:3.10"

stages:
    - Static Analysis
    - Testing
    - Packaging
    - Installing
    - On-device (aarch64)

prospector:
    tags:
        - cpu
    stage: Static Analysis
    script:
        - pip install prospector==1.3.0
        - prospector

black:
    tags:
        - cpu
    stage: Static Analysis
    script:
        - pip install black==23.3.0 # The version here should be the same as in .pre-commit-config.yaml
        - black --check .


shell_check:
    tags:
        - cpu
    image: koalaman/shellcheck-alpine:stable
    stage: Static Analysis
    before_script:
        - shellcheck --version
    script:
        - shellcheck scripts/*.sh


pypackage-install-test:
    tags:
        - cpu
    stage: Installing
    script:
        - make install

unit_test_latency_cpu:
    tags:
        - cpu
    stage: Testing
    script:
        - make install
        - make latency

unit_test_python_3_10:
    image: "python:3.10"
    tags:
        - docker
    stage: Testing
    script:
        - pip install pytest
        - pwd
        - ls -l
        - make install
        - python -m pytest tests/

test_cov:
    tags:
        - cpu
    stage: Testing
    script:
        - pip install -r requirements_dev.txt
        - pwd
        - ls -l
        - export PYTHONPATH="$PYTHONPATH:."
        - python -c "import sys;print(sys.path)"
        - make install
        - coverage run --source pytorch_hccl_tests -m pytest
        - coverage xml
        - coverage report -m
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
    coverage: '/TOTAL.*\s+(\d+%)$/' # See https://stackoverflow.com/questions/66780206/gitlab-coverage-badge-always-unknow

python_packaging:
    tags:
        - cpu
    stage: Packaging
    script:
        - make dist

secret_detection:
    stage: Static Analysis
    tags:
        - cpu
    image:
        name: "zricethezav/gitleaks:v8.0.6"
        entrypoint: [""]
    script:
        - gitleaks detect -v --source .


##############################################################################
# On-device (NPU) collective benchmarks
#
# `parallel:matrix` expands one job per (collective, world size) pair, so a
# single failing collective is immediately visible in the pipeline instead of
# being buried in one long serial log.
#
# Note: DEVICE must be passed on the `make` command line (the Makefile assigns
# it with `=`, which would shadow the environment); WORLD_SIZE is `?=` in the
# Makefile, so the CI variable is honoured as-is.
##############################################################################
.on_device_npu:
    image: quay.io/ascend/cann:9.1.0-910b-ubuntu22.04-py3.12
    variables:
        DEVICE: "npu"
        HCCL_DTYPE: "float16"
        OMP_NUM_THREADS: "1"  # To suppress a torchrun warning
    before_script:
        - source /usr/local/Ascend/ascend-toolkit/set_env.sh
        - npu-smi info
        - python3 -VV
    script:
        - make ${INSTALL_TARGET}
        - echo "Running ${BENCH} (device=${DEVICE} world_size=${WORLD_SIZE} dtype=${HCCL_DTYPE})"
        - make ${BENCH} DEVICE=${DEVICE}
    artifacts:
        when: always
        expire_in: 1 week
        paths:
            - "osu_*.csv"
            - "*.log"
    retry:
        max: 1
        when: runner_system_failure

.collectives_matrix:
    parallel:
        matrix:
            - BENCH: [allreduce, allgather, broadcast, reducescatter, alltoall, barrier, gather, reduce, scatter]
              WORLD_SIZE: ["2", "4", "8"]

collectives_npu_aarch64_910B2:
    extends:
        - .on_device_npu
        - .collectives_matrix
    stage: On-device (aarch64)
    tags:
        - docker_npu_910B2  # On-device NPU (aarch64 / 910B)
    variables:
        INSTALL_TARGET: "install-npu-arm"
    when: manual
    allow_failure: true
