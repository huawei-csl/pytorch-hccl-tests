image: "python:3.10"

stages:
    - Static Analysis
    - Testing
    - Packaging
    - Installing

prospector:
    tags:
        - cpu
    stage: Static Analysis
    script:
        - pip install prospector==1.3.0
        - prospector

black:
    tags:
        - cpu
    stage: Static Analysis
    script:
        - pip install black==23.3.0 # The version here should be the same as in .pre-commit-config.yaml
        - black --check .


shell_check:
    tags:
        - cpu
    image: koalaman/shellcheck-alpine:stable
    stage: Static Analysis
    before_script:
        - shellcheck --version
    script:
        - shellcheck scripts/*.sh


pypackage-install-test:
    tags:
        - cpu
    stage: Installing
    script:
        - make install

unit_test_latency_cpu:
    tags:
        - cpu
    stage: Testing
    script:
        - make install
        - make latency

unit_test_python_3_10:
    image: "python:3.10"
    tags:
        - docker
    stage: Testing
    script:
        - pip install pytest
        - pwd
        - ls -l
        - make install
        - python -m pytest tests/

test_cov:
    tags:
        - cpu
    stage: Testing
    script:
        - pip install -r requirements_dev.txt
        - pwd
        - ls -l
        - export PYTHONPATH="$PYTHONPATH:."
        - python -c "import sys;print(sys.path)"
        - make install
        - coverage run --source pytorch_hccl_tests -m pytest
        - coverage xml
        - coverage report -m
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage.xml
    coverage: '/TOTAL.*\s+(\d+%)$/' # See https://stackoverflow.com/questions/66780206/gitlab-coverage-badge-always-unknow

python_packaging:
    tags:
        - cpu
    stage: Packaging
    script:
        - make dist

secret_detection:
    stage: Static Analysis
    tags:
        - cpu
    image:
        name: "zricethezav/gitleaks:v8.0.6"
        entrypoint: [""]
    script:
        - gitleaks detect -v --source .
